name: IDA Analysis

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: "Name of the file"
        required: true
        type: string
      file_link:
        description: "GDrive link of the file"
        required: true
        type: string
      generate_c:
        description: "Generate C pseudocode"
        required: false
        type: boolean
        default: false
      installer_link:
        description: "GDrive link/ID of the IDA Pro installer"
        required: true
        type: string

concurrency:
  group: ida-analysis-${{ github.ref }}
  cancel-in-progress: true

env:
  IDA_VERSION: "9.0"
  IDA_DIR: "idapro-9.0"

jobs:
  ida_analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install python3 python3-pip pipx
        pipx install gdown
        # Make pipx-installed tools available to subsequent steps.
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Download IDA Pro Installer
      run: |
        gdown --fuzzy -O idapro_90_x64linux.run "${{ github.event.inputs.installer_link }}"
        test -s idapro_90_x64linux.run

    - name: Install IDA Pro
      run: |
        chmod +x idapro_90_x64linux.run
        ./idapro_90_x64linux.run --mode unattended

    - name: Patch IDA Pro
      run: |
        cp "$HOME/$IDA_DIR/libida.so" .
        cp "$HOME/$IDA_DIR/libida64.so" .
        python3 ida90_beta.py
        mv libida.so.patched "$HOME/$IDA_DIR/libida.so"
        mv libida64.so.patched "$HOME/$IDA_DIR/libida64.so"
        mv ida.hexlic "$HOME/.idapro/"
        rm -f libida.so libida64.so

    - name: Setup IDA Pro
      run: |
        pip install "$HOME/$IDA_DIR/idalib/python"
        python3 "$HOME/$IDA_DIR/idalib/python/py-activate-idalib.py"
        python3 ida90_eula.py

    - name: Download File for Analysis
      run: |
        gdown --fuzzy -O "${{ github.event.inputs.target_file }}" "${{ github.event.inputs.file_link }}"
        test -s "${{ github.event.inputs.target_file }}"

    - name: Run IDA Pro Headless Analysis
      run: |
        "$HOME/$IDA_DIR/idat64" -P+ -A -S"analyse.idc" "${{ github.event.inputs.target_file }}"

    - name: Generate C Pseudocode
      if: ${{ github.event.inputs.generate_c == 'true' }}
      run: |
        python3 ida90_pseudocode.py -f "${{ github.event.inputs.target_file }}.i64"

    - name: Upload Analysed Database
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.target_file }}-Database
        path: ${{ github.event.inputs.target_file }}.i64
        compression-level: 9

    - name: Upload Pseudocode
      uses: actions/upload-artifact@v4
      if: ${{ github.event.inputs.generate_c == 'true' }}
      with:
        name: ${{ github.event.inputs.target_file }}-Pseudocode
        path: ${{ github.event.inputs.target_file }}.c
        compression-level: 9
